{% extends "base.html" %}{% block title %}Alterar senha - ERB Maps{% endblock %}
{% block content %}<div class="auth-shell"><section class="auth-card"><h1>Alterar senha</h1><form method="post">
<label>Senha atual<input class="form-control" type="password" name="current_password" required></label>
<label>Nova senha<input class="form-control" type="password" name="new_password" minlength="6" required></label>
<label>Confirmar nova senha<input class="form-control" type="password" name="password_confirm" minlength="6" required></label>
<button class="btn btn-primary">Salvar nova senha</button></form></section></div>{% endblock %}
